# Prueft bei jedem Push, dass das Muster laeuft: Typen, Tests und das
# Validierungs-Script. Laeuft auf Linux und deckt damit ab, was lokal unter
# Windows nicht geprueft wird.
#
# validate:content laeuft hier ohne content/site.json und muss trotzdem gruen
# sein. Genau das ist der Auslieferungszustand.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run validate:content
